name: Portable regression
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run -e reterminal_e1001
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow platformio ziglang
      - run: pio pkg install -e host_native
      - run: python tools/check_public_repo.py
      - run: python -m pytest host/tests -q
      - run: python tools/run_native_tests.py
      - run: python tools/mutation_check.py
      - run: python tools/soak_report.py test/fixtures/soak_ok.log
      - run: python tools/render_previews.py
