; K-Dash E1001 — PlatformIO project
; Target: Seeed reTerminal E1001 (ESP32-S3, 800x480 ePaper) only.
; E1002/E1003/XIAO builds are NOT supported (see docs/08_RELEASE_RECOVERY_CI.md).

[platformio]
default_envs = reterminal_e1001
src_dir = src
include_dir = include
test_dir = test_native
data_dir = data

[env:reterminal_e1001]
; Pinned to the platform the evidence builds used (reproducible builds, P6).
platform = espressif32@8.0.0
; Board + memory verified against the official example
; examples/official/LVGLePaperStatusPanel @ 8d97d891 (hardware/board_e1001.md).
; Partition/OTA slots stay UNDECIDED until 32MB hardware is verified (01 주의).
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
  -D KDASH_BOARD_E1001=1
  -D CORE_DEBUG_LEVEL=0
  -D RETERMINAL_E1001
  -D EPAPER_LVGL_HOR_RES=800
  -D EPAPER_LVGL_VER_RES=480
  -D BOARD_HAS_PSRAM
  -D KDASH_FW_VERSION=\"1.0.0\"
  -Wall
lib_deps =
  ; Direct UC8179 driver first per ADR 0004 (GxEPD2 is GPL-3.0, U-13). LVGL only if UI outgrows it.
  ; Display lib is pinned when the raster adapter lands (no source includes
  ; it yet) — registry name + license re-checked at that time.
  ; ArduinoJson: MIT, header-only; used by src/providers/ProviderJson.cpp.
  bblanchon/ArduinoJson@7.4.3

[env:reterminal_e1001_dev]
extra_scripts = pre:scripts/private_config.py
; 개발 전용: 저장소 밖 kdash_private_credentials.h의 Wi-Fi/키를 NVS가 비어 있을 때의 초기값으로 쓴다.
; 위치/이전 방법: docs/20_PUBLIC_REPOSITORY_GUIDE.md (ADR 0030).
; 기본 환경(reterminal_e1001)은 이 파일을 컴파일하지 않는다 -> 설정은 포털(AP/LAN)로 입력한다(ADR 0024).
; 릴리스는 기본 환경만 사용한다(scripts/package_release.py).
extends = env:reterminal_e1001
build_flags =
  ${env:reterminal_e1001.build_flags}
  -D KDASH_ALLOW_DEV_CREDENTIALS=1

[env:reterminal_e1001_protected_dev]
; This user's confirmed SY6974B device opt-in. Stored portal settings win.
; Development credentials remain local; never use this env for release packaging.
extends = env:reterminal_e1001_dev
build_flags =
  ${env:reterminal_e1001_dev.build_flags}
  -D KDASH_DEV_CHARGE_PROTECT=1

[env:reterminal_e1001_fast_dev]
; Hardware validation of the fast differential refresh (ADR 0034). Turns it on
; only while no stored settings exist (config source=dev); portal/NVS wins.
; Development credentials remain local; never use this env for release packaging.
extends = env:reterminal_e1001_protected_dev
build_flags =
  ${env:reterminal_e1001_protected_dev.build_flags}
  -D KDASH_DEV_FAST_REFRESH=1

[env:reterminal_e1001_validation_dev]
; One-shot physical Wi-Fi loss + watchdog stall. NEVER leave this image deployed.
extends = env:reterminal_e1001_protected_dev
build_flags =
  ${env:reterminal_e1001_protected_dev.build_flags}
  -D KDASH_DEV_STABILITY_SELFTEST=1

[env:host_native]
; Runs test_native/ on the build machine (needs a host gcc/clang).
; test_build_src: PlatformIO 6 defaults to NOT building src/ for tests
; (ISSUE-003) — without it every portable function is an undefined symbol.
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<net/HttpTransport.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -D KDASH_HOST_TEST=1
  -Wall
  -std=c++17
